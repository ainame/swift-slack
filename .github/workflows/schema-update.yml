name: Schema Update

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: schema-update
  cancel-in-progress: true

jobs:
  schema-update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Update apt package index
        run: sudo apt-get update

      - name: Setup Swiftly
        uses: vapor/swiftly-action@v0.2.1

      # The root Package.resolved is not tracked, so the cache is keyed on the
      # resolution result after generation: restore the newest cache by prefix,
      # then save under the new key only when the resolved dependencies changed.
      - name: Restore Swift build cache
        id: restore-swift-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build
            Tools/.build
          key: ${{ runner.os }}-schema-update-swift-${{ hashFiles('.swift-version', 'Tools/Package.swift', 'Tools/Package.resolved') }}-
          restore-keys: |
            ${{ runner.os }}-schema-update-swift-${{ hashFiles('.swift-version', 'Tools/Package.swift', 'Tools/Package.resolved') }}-
            ${{ runner.os }}-schema-update-swift-

      - name: Install generator dependencies
        run: npm ci --ignore-scripts

      - name: Update schemas
        id: update
        run: |
          # Update submodules to latest
          make update

          # Generate and format generated code
          make generate

          # Supporting vendor and manifest changes do not open a PR on their own.
          GENERATED_CHANGES=$(git status --porcelain -- \
            Sources/SlackClient/WebAPI/Generated \
            Sources/SlackApp/Events/Generated \
            Sources/SlackModels/Generated)

          if [[ -n "$GENERATED_CHANGES" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Generated code changes detected:"
            echo "$GENERATED_CHANGES"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No schema or generated code changes"
          fi

      - name: Run tests
        if: steps.update.outputs.changes == 'true'
        run: swift test

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Compute Swift build cache key
        id: swift-cache-key
        run: echo "key=${{ runner.os }}-schema-update-swift-${{ hashFiles('.swift-version', 'Tools/Package.swift', 'Tools/Package.resolved') }}-${{ hashFiles('Package.swift', 'Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Save Swift build cache
        if: steps.restore-swift-cache.outputs.cache-matched-key != steps.swift-cache-key.outputs.key
        uses: actions/cache/save@v6
        with:
          path: |
            .build
            Tools/.build
          key: ${{ steps.swift-cache-key.outputs.key }}

      - name: Create Pull Request
        if: steps.update.outputs.changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            Sources/SlackClient/WebAPI/Generated/
            Sources/SlackApp/Events/Generated/
            Sources/SlackModels/Generated/
            vendor/
            Package.swift
          commit-message: |
            Update Slack API schemas

            This is an automated update of the Slack API schemas from upstream sources.
          branch: automated/schema-update
          delete-branch: true
          title: 'Update Slack API schemas'
          body-path: .github/pull_request_templates/schema-update.md
          labels: |
            schema-update
          reviewers: ainame

      - name: Dispatch pull request tests
        if: steps.update.outputs.changes == 'true' && steps.create-pr.outputs.pull-request-number
        # GITHUB_TOKEN suppresses push-triggered workflows, but workflow_dispatch is exempt.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run test.yml --ref automated/schema-update
