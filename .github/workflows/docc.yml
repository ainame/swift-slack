name: Deploy DocC Documentation

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/docc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/docc.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update apt package index
        run: sudo apt-get update

      # Swift build caches are tied to the runner image as well as the toolchain.
      - name: Read runner image
        id: env-info
        run: echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"

      - name: Install Swift
        uses: vapor/swiftly-action@v0.2.1
        with:
          toolchain: latest

      # Package.resolved is not tracked, so the cache is keyed on the resolution
      # result. DocC builds with the latest toolchain, so it keeps its own prefix.
      - name: Restore Swift build cache
        id: restore-swift-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ steps.env-info.outputs.image }}-swift-docc-${{ hashFiles('Package.swift') }}-
          restore-keys: |
            ${{ steps.env-info.outputs.image }}-swift-docc-${{ hashFiles('Package.swift') }}-
            ${{ steps.env-info.outputs.image }}-swift-docc-

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Compute Swift build cache key
        id: swift-cache-key
        run: echo "key=${{ steps.env-info.outputs.image }}-swift-docc-${{ hashFiles('Package.swift') }}-${{ hashFiles('Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Build DocC Documentation
        run: |
          make doc

      - name: Save Swift build cache
        if: steps.restore-swift-cache.outputs.cache-matched-key != steps.swift-cache-key.outputs.key
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.swift-cache-key.outputs.key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/swift-slack

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
