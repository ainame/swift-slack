name: Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install generator dependencies
        run: npm ci --ignore-scripts

      - name: Run script tests
        run: make test-scripts

      - name: Update apt package index
        run: sudo apt-get update

      # Swift build caches are tied to the runner image as well as the toolchain.
      - name: Read Swift version and runner image
        id: env-info
        run: |
          echo "swift-version=$(cat .swift-version)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"

      - name: Setup Swiftly
        uses: vapor/swiftly-action@v0.2.1
        with:
          toolchain: ${{ steps.env-info.outputs.swift-version }}

      # Package.resolved is not tracked, so the cache is keyed on the resolution
      # result: restore the newest cache by prefix, then save under the new key
      # only when the resolved dependencies changed.
      - name: Restore Swift build cache
        id: restore-swift-cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: ${{ steps.env-info.outputs.image }}-swift-build-${{ hashFiles('.swift-version', 'Package.swift') }}-
          restore-keys: |
            ${{ steps.env-info.outputs.image }}-swift-build-${{ hashFiles('.swift-version', 'Package.swift') }}-
            ${{ steps.env-info.outputs.image }}-swift-build-

      - name: Resolve Swift package dependencies
        run: swift package resolve

      - name: Compute Swift build cache key
        id: swift-cache-key
        run: echo "key=${{ steps.env-info.outputs.image }}-swift-build-${{ hashFiles('.swift-version', 'Package.swift') }}-${{ hashFiles('Package.resolved') }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      - name: Save Swift build cache
        if: steps.restore-swift-cache.outputs.cache-matched-key != steps.swift-cache-key.outputs.key
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.swift-cache-key.outputs.key }}
