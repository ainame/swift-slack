# Type overrides for java-slack-sdk fields whose declared Java type contradicts recorded Slack responses.
#
# Policy:
#   1. Everything is generated from the Java declarations (gen_openapi.rb).
#   2. The only exceptions are fields where values recorded in the upstream java-slack-sdk fixtures
#      (vendor/java-slack-sdk/json-logs/samples/api/*.json) contradict the Java type, because Gson coerces
#      (a JSON number into a Java String, ...) while Swift's JSONDecoder does not. scan_mismatch.rb finds them
#      mechanically (its "java fixtures" section) and fails while a mismatch has no entry here.
#   3. Mismatches seen only in the slack-api-ref docs examples are ignored: Java's type stays (scan_mismatch.rb
#      still prints them for information).
#
# Key:      <Java FQN of the declaring class>#<JSON key>   (nested classes: Outer.Inner)
# type:     integer | number | string | boolean | untyped  (the type emitted instead of the Java one)
# java_type: the Java declaration, for the generated doc comment and checked against the source
# reason:   why the Java type is wrong
# evidence: fixture methods (json-logs/samples/api/<method>.json) recording the contradicting values
# gen_openapi.rb fails if a key names a class or field that no longer exists, or java_type no longer matches.

