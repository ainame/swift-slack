# Type overrides for upstream java-slack-sdk fields whose declared Java type contradicts recorded Slack responses.
#
# Policy:
#   1. Everything is generated from the Java declarations (scripts/lib/java_openapi.rb).
#   2. The only exceptions are fields where values recorded in the upstream java-slack-sdk fixtures
#      (vendor/java-slack-sdk/json-logs/samples/{api,events}/*.json) contradict the Java declaration, typically
#      because Gson coerces (a JSON number into a Java String, ...) while Swift's JSONDecoder does not.
#      scripts/scan_fixture_mismatches.rb finds them mechanically and fails while a mismatch has no entry here.
#   3. Mismatches seen only in the upstream slack-api-ref docs examples are ignored: Java's type stays.
#
# Key:       <Java FQN of the declaring class>#<JSON key>   (nested classes: Outer.Inner)
# type:      integer | number | string | boolean | untyped | schema   (emitted instead of the Java type)
# schema:    for `type: schema`, the OpenAPI schema to emit; it may refer to scripts/handwritten_schemas.yml
# java_type: the Java declaration, for the generated doc comment and checked against the source
# reason:    why the Java type is wrong
# evidence:  fixtures (json-logs/samples/api/<method>.json) recording the contradicting values
# added:     true for a field the Java class does not declare (with `type: schema` and no java_type)
# Generation fails if a key names a class or field that no longer exists, or java_type no longer matches.

